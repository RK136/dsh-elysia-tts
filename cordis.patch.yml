# dsh-elysia-tts bundle patch
#
# 安装后 dsh 启动时自动加载本插件。
# ⚠️ 只需要把下面两个路径改成你自己机器上的真实路径。
#    权重缺失时会自动从 Release 下载，推理配置自动生成，参考音自带。
- insert:
    - id: elysia-tts
      name: dsh-elysia-tts
      config:
        gptSovitsDir: 'D:/GPT-SoVITS'
        pythonPath: 'D:/conda/envs/sovits/python.exe'
        autoStart: true
        autoDownloadModels: true
        weightsBaseUrl: 'https://github.com/RK136/dsh-elysia-tts/releases/download/models-v1'
        temperature: 0.7
        noiseScale: 0.35
