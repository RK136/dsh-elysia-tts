# dsh-elysia-tts bundle patch
#
# 安装后 dsh 启动时自动加载本插件。
# ⚠️ 下面两行只是示例，请改成你自己机器上的真实路径（绝对路径）。
#    也可以在 profile 的 cordis.patch.yml 里同 id 覆盖，不用改本文件。
- insert:
    - id: elysia-tts
      name: dsh-elysia-tts
      config:
        gptSovitsDir: 'D:/GPT-SoVITS'
        pythonPath: 'D:/conda/envs/sovits/python.exe'
        apiConfig: 'GPT_SoVITS/configs/tts_infer_v2pro.yaml'
        port: 9880
        autoStart: true
        startTimeoutMs: 180000
        refAudio: ''
        promptText: ''
        temperature: 0.7
        noiseScale: 0.35
